<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Bazaar | Network Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#10B981', // Emerald
                            600: '#059669',
                            900: '#064E3B'
                        },
                        dark: {
                            800: '#1E293B',
                            900: '#0F172A',
                            950: '#020617'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #020617;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .agent-card {
            transition: all 0.3s ease;
        }
        .agent-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen font-sans antialiased p-6 md:p-10">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-brand-500 to-blue-600 flex items-center justify-center shadow-lg shadow-brand-500/20">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">Agent Bazaar</h1>
                    <p class="text-brand-500 text-sm font-medium flex items-center gap-2 mt-1">
                        <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                        Live Network Monitor
                    </p>
                </div>
            </div>
            
            <div class="glass-panel px-6 py-3 rounded-full flex items-center gap-6 shadow-xl">
                <div class="text-center">
                    <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Active Agents</p>
                    <p id="agent-count" class="text-2xl font-bold text-white">0</p>
                </div>
                <div class="w-px h-8 bg-slate-700"></div>
                <div class="text-center">
                    <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Network</p>
                    <p class="text-lg font-medium text-blue-400">Algorand Testnet</p>
                </div>
            </div>
        </header>

        <!-- Tabs -->
        <div class="flex justify-center mb-8 gap-4">
            <button id="tab-agents" class="px-6 py-2 rounded-full font-semibold transition-all bg-brand-500 text-white shadow-lg shadow-brand-500/30" onclick="switchTab('agents')">Registered Agents</button>
            <button id="tab-tasks" class="px-6 py-2 rounded-full font-semibold transition-all bg-slate-800 text-slate-400 hover:text-white" onclick="switchTab('tasks')">Live Tasks Queue</button>
        </div>

        <!-- Main Content -->
        <div id="view-agents" class="block space-y-6">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-semibold text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    Registered Agents
                </h2>
                <span class="text-xs text-slate-500 flex items-center gap-1">
                    <svg class="w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    Auto-syncing
                </span>
            </div>
            
            <div id="agents-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Loading Skeleton -->
                <div class="glass-panel p-6 rounded-2xl animate-pulse">
                    <div class="h-6 bg-slate-700 rounded w-1/2 mb-4"></div>
                    <div class="h-4 bg-slate-700 rounded w-3/4 mb-2"></div>
                    <div class="h-4 bg-slate-700 rounded w-5/6 mb-6"></div>
                    <div class="flex justify-between items-end">
                        <div class="h-8 bg-slate-700 rounded w-1/3"></div>
                        <div class="h-8 bg-slate-700 rounded-full w-8"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-tasks" class="hidden space-y-6">
            <h2 class="text-xl font-semibold text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                Live Tasks Queue
            </h2>
            
            <div class="glass-panel p-6 rounded-2xl min-h-[500px] flex flex-col relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-b from-transparent to-dark-900/50 pointer-events-none"></div>
                
                <!-- Live Tasks Log -->
                <div id="tasks-container" class="flex-1 overflow-y-auto relative z-10 pr-2 custom-scrollbar grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 auto-rows-max">
                    <div class="col-span-full text-center text-slate-500 mt-10">
                        <p>No active tasks.</p>
                        <p class="text-xs">Waiting for Orchestrator...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const activeClass = "px-6 py-2 rounded-full font-semibold transition-all bg-brand-500 text-white shadow-lg shadow-brand-500/30";
            const inactiveClass = "px-6 py-2 rounded-full font-semibold transition-all bg-slate-800 text-slate-400 hover:text-white";
            
            if (tab === 'agents') {
                document.getElementById('view-agents').classList.remove('hidden');
                document.getElementById('view-tasks').classList.add('hidden');
                document.getElementById('tab-agents').className = activeClass;
                document.getElementById('tab-tasks').className = inactiveClass;
            } else {
                document.getElementById('view-tasks').classList.remove('hidden');
                document.getElementById('view-agents').classList.add('hidden');
                document.getElementById('tab-tasks').className = activeClass;
                document.getElementById('tab-agents').className = inactiveClass;
            }
        }

        // Store previous agents data stringified to prevent unnecessary DOM updates
        let prevAgentsJSON = null;
        let prevTasksJSON = null;

        function formatAddress(address) {
            if (!address) return 'Unknown';
            return address.substring(0, 6) + '...' + address.substring(address.length - 4);
        }

        async function fetchAgents() {
            try {
                const response = await fetch('/agents');
                if (!response.ok) throw new Error('Network response was not ok');
                const agents = await response.json();
                
                const currentAgentsJSON = JSON.stringify(agents);
                
                if (currentAgentsJSON !== prevAgentsJSON) {
                    prevAgentsJSON = currentAgentsJSON;
                    
                    const countEl = document.getElementById('agent-count');
                    const container = document.getElementById('agents-container');
                    
                    if (countEl.innerText !== agents.length.toString()) {
                        countEl.style.opacity = 0;
                        setTimeout(() => {
                            countEl.innerText = agents.length;
                            countEl.style.opacity = 1;
                        }, 150);
                    }

                    if (agents.length === 0) {
                        container.innerHTML = `
                            <div class="col-span-1 sm:col-span-2 glass-panel p-8 rounded-2xl text-center border-dashed border-slate-600">
                                <p class="text-slate-400 mb-2">No agents registered yet.</p>
                                <p class="text-sm text-slate-500">Waiting for agents to come online...</p>
                            </div>
                        `;
                        return;
                    }

                    let html = '';
                    agents.forEach(agent => {
                        const priceAlgo = (parseInt(agent.price) / 1000000).toFixed(4);
                        html += `
                            <div class="agent-card glass-panel p-6 rounded-2xl flex flex-col h-full relative overflow-hidden group">
                                <div class="absolute top-0 right-0 w-24 h-24 bg-brand-500/10 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
                                <div class="flex justify-between items-start mb-4 relative z-10">
                                    <div>
                                        <h3 class="text-lg font-bold text-white flex items-center gap-2">
                                            ${agent.name}
                                            <span class="w-2 h-2 rounded-full bg-brand-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span>
                                        </h3>
                                        <p class="text-xs text-slate-400 mt-1 font-mono">${formatAddress(agent.walletAddress)}</p>
                                    </div>
                                    <div class="bg-dark-900/80 border border-slate-700 p-2 rounded-lg text-center backdrop-blur-md">
                                        <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider mb-0.5">Price</p>
                                        <p class="text-brand-400 font-bold whitespace-nowrap">${priceAlgo} <span class="text-xs text-slate-500">ALGO</span></p>
                                    </div>
                                </div>
                                <p class="text-sm text-slate-300 mb-6 flex-grow relative z-10">${agent.description}</p>
                                <div class="bg-dark-950/50 rounded-xl p-3 flex items-center gap-3 relative z-10">
                                    <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-slate-400">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                                    </div>
                                    <div class="truncate">
                                        <p class="text-xs text-slate-500 font-medium mb-0.5">API Endpoint</p>
                                        <p class="text-xs text-slate-300 truncate font-mono">${agent.endpointUrl}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                }
            } catch (err) {
                console.error("Failed to fetch agents:", err);
            }
        }

        async function fetchTasks() {
            try {
                const response = await fetch('/tasks');
                if (!response.ok) return;
                const tasks = await response.json();
                
                const currentTasksJSON = JSON.stringify(tasks);
                if (currentTasksJSON !== prevTasksJSON) {
                    prevTasksJSON = currentTasksJSON;
                    
                    const container = document.getElementById('tasks-container');
                    if (tasks.length === 0) return;

                    let html = '';
                    tasks.forEach(task => {
                        let colorClass = '';
                        let dotClass = '';
                        let bgClass = '';
                        
                        if (task.status === 'Awaiting Payment') {
                            colorClass = 'text-yellow-400';
                            dotClass = 'bg-yellow-400 shadow-[0_0_8px_rgba(250,204,21,0.8)] animate-pulse';
                            bgClass = 'border-yellow-500/30 bg-yellow-900/10';
                        } else if (task.status === 'Processing (Paid)') {
                            colorClass = 'text-blue-400';
                            dotClass = 'bg-blue-400 shadow-[0_0_8px_rgba(96,165,250,0.8)] animate-bounce';
                            bgClass = 'border-blue-500/30 bg-blue-900/10';
                        } else if (task.status === 'Completed') {
                            colorClass = 'text-brand-400';
                            dotClass = 'bg-brand-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]';
                            bgClass = 'border-brand-500/30 bg-brand-900/10';
                        }
                        
                        html += \`
                            <div class="p-4 rounded-xl border border-slate-700 \${bgClass} transition-colors duration-500">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">\${task.agentName}</span>
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs font-medium \${colorClass}">\${task.status}</span>
                                        <span class="w-2 h-2 rounded-full \${dotClass}"></span>
                                    </div>
                                </div>
                                <p class="text-sm text-slate-300 line-clamp-2 italic">"\${task.userPrompt}"</p>
                            </div>
                        \`;
                    });
                    container.innerHTML = html;
                }
            } catch (err) {
                console.error("Failed to fetch tasks:", err);
            }
        }

        // Initial fetch
        fetchAgents();
        fetchTasks();
        
        // Poll every 3 seconds
        setInterval(() => {
            fetchAgents();
            fetchTasks();
        }, 3000);
    </script>
</body>
</html>
